name: tagpr

on:
  push:
    branches: [main]

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.run-tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: run-tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flakehub:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/flakehub.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
